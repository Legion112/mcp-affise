# Copy to tenants.yaml (gitignored).
# Use Symfony-style %env(VAR)% to pull secrets/hosts from the environment.
# Literals are also fine for non-secret fields (e.g. host: api.affise.com).

tenants:
  - id: example
    host: "%env(AFFISE_EXAMPLE_HOST)%"
    token: "%env(AFFISE_EXAMPLE_TOKEN)%"
    description: Example Affise tenant
