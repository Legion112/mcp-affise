# Copy to tenants.yaml (gitignored) and set tokens via env:
#   AFFISE_TENANT_<ID>_TOKEN / AFFISE_TENANT_<ID>_HOST
#
# Host in this file is a default; env HOST overrides it.
# Token must come from env (never commit tokens).

tenants:
  - id: example
    host: api.affise.com
    # description is shown by list_tenants
    description: Example Affise tenant
